name: Release

# Push a tag such as v0.2.0 to build the Windows installer, the macOS DMGs (arm64 and x64) and the
# Linux AppImage, and publish them as a GitHub release. Running it by hand (workflow_dispatch)
# builds them as workflow artifacts without publishing. The web app's Install button links to
# releases/latest/download/redcolumn-Setup.exe and redcolumn-{arm64,x64}.dmg. The installed app
# checks the latest release at every launch (Windows updates itself from latest.yml and the
# blockmap; the Mac app links to the release page) and compares its tag with the app's version,
# so the tag must be `v` plus the version in apps/desktop/package.json. A tag with a suffix
# (v0.3.0-beta.1) is published as a pre-release, which none of those looks at.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

# Read-only by default; only the publish job can write.
permissions:
  contents: read

# Actions are pinned to full commit SHAs (the tag in the comment). See ci.yml.
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Uses the pnpm version in package.json's packageManager field.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Tag must match the desktop version
        if: github.event_name == 'push'
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match apps/desktop version $version" >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Package installer
        run: pnpm --filter @nb/desktop package
        env:
          # The installer is unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Public Entra client ID (same value as apps/web/.env.example). Vite inlines it
          # into the web bundle while packaging; without it the installer shows OneDrive
          # as not set up. Not a secret.
          VITE_MICROSOFT_CLIENT_ID: b1c13541-0b78-4c60-8ca4-308aa9b23bd0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          # latest.yml and the blockmap are what the installed app reads to update itself.
          path: |
            apps/desktop/release/redcolumn-Setup.exe
            apps/desktop/release/redcolumn-Setup.exe.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error

  # Typecheck and tests run in the Windows job. Both DMGs are built on one Apple Silicon runner;
  # fetch-assistant-node.mjs --arch picks the matching Node binary for each.
  build-mac:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Package DMGs
        run: pnpm --filter @nb/desktop package:mac
        env:
          # Ad-hoc signed only (electron-builder.yml mac.identity); no Developer ID lookup.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          VITE_MICROSOFT_CLIENT_ID: b1c13541-0b78-4c60-8ca4-308aa9b23bd0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-mac
          path: |
            apps/desktop/release/redcolumn-arm64.dmg
            apps/desktop/release/redcolumn-x64.dmg
          if-no-files-found: error

  # The AppImage is unsigned, like the other installers. It is not updated in place: the Linux app
  # only tells the person a new release exists and opens its page (updater.ts).
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Package AppImage
        run: pnpm --filter @nb/desktop package:linux
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          VITE_MICROSOFT_CLIENT_ID: b1c13541-0b78-4c60-8ca4-308aa9b23bd0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-linux
          path: apps/desktop/release/redcolumn-x86_64.AppImage
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: [build, build-mac, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Installed Windows apps install the latest release by themselves, so publishing waits for a
    # maintainer to approve it (required reviewers on the `release` environment, set in the repo's
    # Settings > Environments).
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-mac

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-linux

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flag=""
          case "$GITHUB_REF_NAME" in *-*) flag="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" redcolumn-Setup.exe redcolumn-Setup.exe.blockmap latest.yml redcolumn-arm64.dmg redcolumn-x64.dmg redcolumn-x86_64.AppImage \
            --title "redcolumn ${GITHUB_REF_NAME#v}" --generate-notes $flag

name: Release

# Push a tag such as v0.2.0 to build the Windows installer and the macOS DMGs (arm64 and x64) and
# publish them as a GitHub release. Running it by hand (workflow_dispatch) builds them as workflow
# artifacts without publishing. The web app's Install button links to
# releases/latest/download/redcolumn-Setup.exe and redcolumn-{arm64,x64}.dmg. The installed app
# checks the latest release at every launch (Windows updates itself from latest.yml and the
# blockmap; the Mac app links to the release page) and compares its tag with the app's version,
# so the tag must be `v` plus the version in apps/desktop/package.json. A tag with a suffix
# (v0.3.0-beta.1) is published as a pre-release, which none of those looks at.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

# Read-only by default; only the publish job can write.
permissions:
  contents: read

# Actions are pinned to full commit SHAs (the tag in the comment). See ci.yml.
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Uses the pnpm version in package.json's packageManager field.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Tag must match the desktop version
        if: github.event_name == 'push'
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match apps/desktop version $version" >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Package installer
        run: pnpm --filter @nb/desktop package
        env:
          # The installer is unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Public Entra client ID (same value as apps/web/.env.example). Vite inlines it
          # into the web bundle while packaging; without it the installer shows OneDrive
          # as not set up. Not a secret.
          VITE_MICROSOFT_CLIENT_ID: b1c13541-0b78-4c60-8ca4-308aa9b23bd0

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer
          # latest.yml and the blockmap are what the installed app reads to update itself.
          path: |
            apps/desktop/release/redcolumn-Setup.exe
            apps/desktop/release/redcolumn-Setup.exe.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error

  # Typecheck and tests run in the Windows job. Both DMGs are built on one Apple Silicon runner;
  # fetch-assistant-node.mjs --arch picks the matching Node binary for each.
  build-mac:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Package DMGs
        run: pnpm --filter @nb/desktop package:mac
        env:
          # Ad-hoc signed only (electron-builder.yml mac.identity); no Developer ID lookup.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          VITE_MICROSOFT_CLIENT_ID: b1c13541-0b78-4c60-8ca4-308aa9b23bd0

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-mac
          path: |
            apps/desktop/release/redcolumn-arm64.dmg
            apps/desktop/release/redcolumn-x64.dmg
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: [build, build-mac]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: installer

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: installer-mac

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flag=""
          case "$GITHUB_REF_NAME" in *-*) flag="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" redcolumn-Setup.exe redcolumn-Setup.exe.blockmap latest.yml redcolumn-arm64.dmg redcolumn-x64.dmg \
            --title "redcolumn ${GITHUB_REF_NAME#v}" --generate-notes $flag

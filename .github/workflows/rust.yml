name: Rust

# The Rust viewer for heavy drawings (rust/): formatting, clippy, and every crate's tests,
# including the GPU fidelity check against PDFium and the save round trip. Windows is the first
# platform; Linux runs the same tests on Mesa's software Vulkan driver.
on:
  push:
    paths:
      - "rust/**"
      - "e2e/fixtures/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "rust/**"
      - "e2e/fixtures/**"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

# Read-only: nothing here writes to the repository.
permissions:
  contents: read

# Actions are pinned to full commit SHAs (the tag in the comment); the toolchain comes from
# rust/rust-toolchain.toml through the runner's own rustup, with no third-party action.
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: rustup show active-toolchain

      # The pinned PDFium build (checked against its SHA-256) for the workers and the tests.
      - name: Fetch PDFium
        run: cargo xtask fetch-pdfium --target win-x64

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # The GPU tests draw on WARP (Direct3D 12's software adapter) on hosted runners.
      - name: Test
        run: cargo test --locked --workspace

      - name: Build the app
        run: cargo build --locked --release -p rc-app

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Software Vulkan for the GPU tests, and Helvetica-width fonts for the text layout.
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers fonts-liberation

      - name: Fetch PDFium
        run: cargo xtask fetch-pdfium --target linux-x64

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

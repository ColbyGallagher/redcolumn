name: Scorecard

# OpenSSF Scorecard: an independent check of the repository's security practices (branch
# protection, pinned dependencies, code review, CI permissions and more). Results are published to
# https://scorecard.dev and shown under Security → Code scanning.
on:
  push:
    branches: [master]
  schedule:
    - cron: '41 5 * * 1'
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      # Publishing the results to scorecard.dev.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif

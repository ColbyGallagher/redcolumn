name: CI

# Runs on every push and pull request: type checks, every package's tests (including the markup
# tool tests), a production build, a dependency audit, a security scan of the desktop app, and
# a packaging build of the Mac and Linux installers.
# A red run means the push would break something.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only: nothing here writes to the repository.
permissions:
  contents: read

# Actions are pinned to full commit SHAs (the tag in the comment), so a moved or hijacked tag cannot
# change what runs. Dependabot (.github/dependabot.yml) proposes updates. See docs/SECURITY-HARDENING.md, 2.5.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Uses the pnpm version in package.json's packageManager field.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # SoftHSM2 is a software smart card, and OpenSC's pkcs11-tool loads certificates onto it: the
      # desktop token tests sign with them (apps/desktop/src/token.test.ts).
      - name: Install SoftHSM2 and OpenSC
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends softhsm2 opensc

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # High and critical advisories in what ships fail the run. Exceptions, each with its reason,
      # are in pnpm-workspace.yaml (auditConfig.ignoreGhsas).
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      # Build tools and tests: reported, not blocking.
      - name: Audit all dependencies (report only)
        continue-on-error: true
        run: pnpm audit --audit-level high

  # The Mac and Linux installers are otherwise only built when a release tag is pushed, so a break
  # in either would show up at release time. These build them on every push and pull request (free
  # on a public repo) and run the tests on a second OS. The e2e suite stays a local gate (pnpm verify).
  package-mac:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Package DMGs
        run: pnpm --filter @nb/desktop package:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

  package-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Package AppImage
        run: pnpm --filter @nb/desktop package:linux
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

  desktop-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Electronegativity checks the Electron shell for unsafe settings (docs/SECURITY-HARDENING.md, E1).
      # HIGH findings fail the run; the rest are listed for review.
      - name: Electronegativity
        run: npx -y @doyensec/electronegativity@1.10.3 -i apps/desktop/src -e 44.7.0 -o electronegativity.csv

      - name: Fail on HIGH findings
        run: node scripts/electronegativity-gate.mjs electronegativity.csv

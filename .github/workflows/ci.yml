name: CI

# Runs on every push and pull request: type checks, every package's tests (including the markup
# tool tests), a production build, a dependency audit, a security scan of the desktop app, a
# packaging build of the Windows, Mac and Linux installers, and the web end-to-end suite.
# A red run means the push would break something.
#
# Pull requests from forks run here on `pull_request`, with the read-only token below and no
# secrets. Never switch to `pull_request_target` or `workflow_run` (for AI review bots or anything
# else) in a way that checks out or runs a fork's code: those run with secrets and a write token.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only: nothing here writes to the repository.
permissions:
  contents: read

# Actions are pinned to full commit SHAs (the tag in the comment), so a moved or hijacked tag cannot
# change what runs. Dependabot (.github/dependabot.yml) proposes updates. See docs/SECURITY-HARDENING.md, 2.5.
jobs:
  # Client drawings and identifiers never reach this public repository: every tracked file, and
  # on a pull request every commit message, added line and added file (scripts/check-client-data.mjs).
  client-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: node scripts/check-client-data.mjs

      - if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-client-data.mjs --range "origin/$BASE_REF..HEAD"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Uses the pnpm version in package.json's packageManager field.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # SoftHSM2 is a software smart card, and OpenSC's pkcs11-tool loads certificates onto it: the
      # desktop token tests sign with them (apps/desktop/src/token.test.ts).
      # qpdf validates written PDFs structurally (`qpdf --check`) in PDF round-trip tests.
      - name: Install SoftHSM2, OpenSC, and qpdf
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends softhsm2 opensc qpdf

      - run: pnpm install --frozen-lockfile

      - name: i18n checks
        run: pnpm i18n:check

      - name: Typecheck
        run: pnpm typecheck

      # Every *.test.* file must be reached by some package's test script (a glob like
      # src/*.test.ts is not recursive, so a nested test would otherwise never run).
      - name: Test files are run
        run: pnpm check:tests

      # New commands get an end-to-end test or a skip reason, not 'todo' (e2e/coverage-todo.json only shrinks).
      # On a pull request the list is also compared with the base branch's, so it cannot be refilled.
      - name: No new untested commands
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            pnpm check:e2e-coverage --base FETCH_HEAD
          else
            pnpm check:e2e-coverage
          fi

      - name: Test
        run: pnpm test
        # Only this job installs SoftHSM2, OpenSC, and qpdf: here the token and qpdf checks must run, not skip.
        env:
          REQUIRE_TOKEN_TESTS: '1'
          REQUIRE_QPDF_TESTS: '1'

      - name: Build
        run: pnpm build

      # The 3D viewer must stay out of the main entry's static imports, and the start-up bundle must
      # not grow more than 5% over scripts/bundle-baseline.json (docs/model3d-plan.md).
      - name: Bundle guard
        run: pnpm check:bundle

      # High and critical advisories in what ships fail the run. Exceptions, each with its reason,
      # are in pnpm-workspace.yaml (auditConfig.ignoreGhsas).
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      # Build tools and tests: reported, not blocking.
      - name: Audit all dependencies (report only)
        continue-on-error: true
        run: pnpm audit --audit-level high

  # The Mac and Linux installers are otherwise only built when a release tag is pushed, so a break
  # in either would show up at release time. These build them on every push and pull request (free
  # on a public repo) and run the tests on a second OS.
  package-mac:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Package DMGs
        run: pnpm --filter @nb/desktop package:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

  # The Windows installer, as release.yml builds it (unsigned, x64), plus the unit tests on Windows.
  # Not a required check until it has a record of passing.
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Package installer
        run: pnpm --filter @nb/desktop package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

  # The web end-to-end suite (e2e/README.md): Chromium against the dev server, in four shards.
  # No secrets; the report is uploaded when a shard fails. Not a required check yet. Tests that are
  # known to fail are listed, with the reason, in e2e/quarantine.md. The desktop project still runs
  # only locally (pnpm e2e:desktop).
  e2e-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @nb/e2e exec playwright install --with-deps chromium

      - name: End-to-end tests (web)
        run: pnpm --filter @nb/e2e exec playwright test --project=web --shard=${{ matrix.shard }}/4

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-web-report-${{ matrix.shard }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

  package-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Package AppImage
        run: pnpm --filter @nb/desktop package:linux
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

  desktop-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Electronegativity checks the Electron shell for unsafe settings (docs/SECURITY-HARDENING.md, E1).
      # HIGH findings fail the run; the rest are listed for review.
      - name: Electronegativity
        run: npx -y @doyensec/electronegativity@1.10.3 -i apps/desktop/src -e 44.7.0 -o electronegativity.csv

      - name: Fail on HIGH findings
        run: node scripts/electronegativity-gate.mjs electronegativity.csv

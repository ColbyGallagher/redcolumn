name: CI

# Runs on every push and pull request: type checks, every package's tests (including the markup
# tool tests) and a production build. A red run means the push would break something.
# Actions are pinned to commits (Dependabot keeps them current; see .github/dependabot.yml).
on:
  push:
  pull_request:
  workflow_dispatch:

# Read-only: CI only checks out, tests and builds.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Uses the pnpm version in package.json's packageManager field.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

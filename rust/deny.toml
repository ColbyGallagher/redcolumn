# cargo deny check: only licences compatible with Apache 2.0, no known advisories.
[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "BSL-1.0", "CC0-1.0", "OFL-1.1", "MIT-0", "0BSD", "CDLA-Permissive-2.0", "Ubuntu-font-1.0", "LicenseRef-UFL-1.0"]
confidence-threshold = 0.9

[advisories]
yanked = "deny"

[bans]
multiple-versions = "allow"

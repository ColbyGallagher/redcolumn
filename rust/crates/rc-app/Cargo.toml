[package]
name = "rc-app"
description = "redcolumn for heavy drawings: the desktop viewer with Rectangle and Text markups"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "redcolumn-rs"
path = "src/main.rs"

[dependencies]
rc-view.workspace = true
rc-pdf.workspace = true
rc-parse.workspace = true
rc-gpu.workspace = true
rc-markup.workspace = true
rc-pdfwrite.workspace = true
rc-cache.workspace = true
eframe = { workspace = true, features = ["clipboard", "x11", "wayland"] }
egui.workspace = true
rfd.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
mimalloc.workspace = true

[lints]
workspace = true

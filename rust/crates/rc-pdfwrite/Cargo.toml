[package]
name = "rc-pdfwrite"
description = "Saving markups into the PDF as an incremental update (annotations with appearance streams)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
rc-parse.workspace = true
rc-scene.workspace = true
rc-markup.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
rc-bench = { path = "../rc-bench" }
rc-pdf.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[[test]]
name = "roundtrip"
harness = false

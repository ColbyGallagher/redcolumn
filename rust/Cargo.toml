[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.90"

[workspace.dependencies]
rc-scene = { path = "crates/rc-scene" }
rc-pdf = { path = "crates/rc-pdf" }
rc-parse = { path = "crates/rc-parse" }
rc-gpu = { path = "crates/rc-gpu" }
rc-view = { path = "crates/rc-view" }
rc-cache = { path = "crates/rc-cache" }
rc-check = { path = "crates/rc-check" }
rc-raster = { path = "crates/rc-raster" }
rc-markup = { path = "crates/rc-markup" }
rc-pdfwrite = { path = "crates/rc-pdfwrite" }

anyhow = "1"
thiserror = "2"
bytemuck = { version = "1", features = ["derive", "extern_crate_alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
crossbeam-channel = "0.5"
rayon = "1"
memmap2 = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_latest"] }
lopdf = { version = "0.45", default-features = false }
lyon = "1"
wgpu = "30"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }
egui = "0.37"
rfd = "0.15"
blake3 = "1"
zune-jpeg = "0.4"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
skrifa = "0.37"
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
proptest = "1"
tempfile = "3"
mimalloc = { version = "0.1", default-features = false }
dirs = "6"
windows = "0.62"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
split-debuginfo = "packed"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.bench]
inherits = "release"
debug = true

[profile.profiling]
inherits = "release"
debug = true
lto = "thin"

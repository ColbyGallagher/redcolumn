# Unsigned installers: an NSIS setup for Windows and a DMG per architecture for macOS. The Release
# workflow attaches them to a GitHub release when a v* tag is pushed (see README). The app checks
# the latest release at every launch. The installed Windows app downloads and installs the update
# itself (electron-updater, from latest.yml and the .blockmap beside the installer; the arm64
# installer reads latest-arm64.yml, see package:win-arm64); the Mac app
# links to the release page, since Squirrel.Mac needs a Developer ID signature.
# The fixed file names keep releases/latest/download/redcolumn-Setup.exe, redcolumn-arm64.dmg and
# redcolumn-x64.dmg stable download links.
# publish only writes app-update.yml into the app (where electron-updater looks) and generates
# latest.yml; the workflow uploads, so electron-builder is always run with publish never.
publish:
  provider: github
  owner: ColbyGallagher
  repo: redcolumn
appId: app.redcolumn.desktop
productName: redcolumn
copyright: Copyright © redcolumn contributors
directories:
  output: release
# Sets the 7z filter for Windows arm64 so the installer can extract its binaries (see the script).
beforePack: scripts/before-pack.cjs
files:
  - dist/**
  - package.json
  # The assistant Node binary is an extra resource. Leaving it in the asar would pack it twice.
  - "!dist/assistant/node.exe"
  - "!dist/assistant/node"
  - "!dist/assistant/LICENSE-node.txt"
  - "!dist/.node-cache/**"
extraResources:
  - from: ../web/dist
    to: web
  # mcp-cli.js plus the Node binary that runs it. The RunAsNode fuse below is off, so this is
  # not the app executable (see apps/desktop/scripts/fetch-assistant-node.mjs).
  - from: dist/assistant
    to: assistant
# Registers redcolumn as a PDF handler. It does not become the default handler.
# perMachine and any default-handler setting are left unset on purpose.
fileAssociations:
  - ext: pdf
    name: PDF
    description: PDF document
    role: Viewer
    mimeType: application/pdf
# Electron fuses, flipped in the packaged binary (docs/SECURITY-HARDENING.md, E1): the app cannot be
# run as plain Node, NODE_OPTIONS and --inspect are ignored, and only the integrity-checked
# app.asar loads.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
win:
  target: nsis
  icon: ../web/dist/icon-512.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: redcolumn-Setup.${ext}
# Not signed with a Developer ID or notarized. identity "-" ad-hoc signs it instead: Apple Silicon
# will not run an unsigned app, and signing re-seals it after the fuses above are flipped.
mac:
  target: dmg
  identity: '-'
  # Hardened runtime is for notarization. With an ad-hoc signature it makes library validation
  # refuse Electron's frameworks (no Team ID), and the app fails to launch.
  hardenedRuntime: false
  icon: ../web/dist/icon-512.png
  category: public.app-category.productivity
dmg:
  artifactName: redcolumn-${arch}.${ext}
# The executable name is set because the package name (@nb/desktop) would otherwise become
# @nbdesktop, which AppImage rejects. The AppImage name stays fixed, like the other installers.
# executableArgs is empty: electron-builder otherwise writes --no-sandbox into the menu entry, which
# turns off Chromium's sandbox on every launch. AppRun adds --no-sandbox only when the system
# cannot create user namespaces (the sandbox cannot run there).
linux:
  target: AppImage
  category: Office
  executableName: redcolumn
  executableArgs: []
  artifactName: redcolumn-x86_64.${ext}

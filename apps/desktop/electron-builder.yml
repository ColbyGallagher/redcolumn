# Unsigned NSIS installer. It is attached to a GitHub release by hand (see README), and the app's
# Help › Check for Updates compares its version with the latest release and links to it.
# The fixed file name keeps releases/latest/download/redcolumn-Setup.exe a stable download link.
appId: app.redcolumn.desktop
productName: redcolumn
copyright: Copyright © redcolumn contributors
directories:
  output: release
files:
  - dist/**
  - package.json
extraResources:
  - from: ../web/dist
    to: web
# Registers redcolumn as a PDF handler. It does not become the default handler.
# perMachine and any default-handler setting are left unset on purpose.
fileAssociations:
  - ext: pdf
    name: PDF
    description: PDF document
    role: Viewer
    mimeType: application/pdf
win:
  target: nsis
  icon: ../web/dist/icon-512.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: redcolumn-Setup.${ext}
mac:
  target: dmg
  category: public.app-category.productivity
linux:
  target: AppImage
  category: Office
